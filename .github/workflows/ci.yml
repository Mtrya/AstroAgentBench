name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - aacl-ijcnlp-2026

jobs:
  test-and-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.11"

      - name: Sync environment
        run: uv sync --locked

      - name: Validate finished benchmark contract
        run: uv run --locked python scripts/validate_benchmark_contract.py

      - name: Validate finished solver contract
        run: uv run --locked python scripts/validate_solver_contract.py

      - name: Run tests
        run: uv run --locked pytest tests/
