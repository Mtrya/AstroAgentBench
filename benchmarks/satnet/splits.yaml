# Canonical source snapshot checksums and provenance: sources/manifest.json.
# Generation uses bundled inputs and does not refresh live upstream data.
# Canonical SatNet dataset construction for the finished benchmark.
#
# The bundled SatNet input retains the historical upstream ref below and is
# rewritten into the split-aware dataset layout under dataset/cases/<split>/.
source:
  upstream_ref: master  # Historical provenance label, checked against the bundled snapshot.

# Pair dataset/example_solution.json with the first published 2018 benchmark case.
example_smoke_case: test/W10_2018

splits:
  # SatNet currently exposes one committed evaluation split containing all five
  # published 2018 week/year cases.
  test:
    - W10_2018
    - W20_2018
    - W30_2018
    - W40_2018
    - W50_2018
