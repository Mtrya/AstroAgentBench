[project]
name = "astroagentbench"
version = "0.1.0"
description = "Space mission design benchmarks for complete agent systems and traditional solvers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "brahe[plots]>=1.7.0",
    "huggingface-hub>=1.29.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "plotly>=6.6.0",
    "pyyaml>=6.0.3",
    "pytest>=9.1.1",
    "skyfield>=1.55",
    "shapely>=2.1.2",
    "pyproj>=3.7.2",
]

[project.optional-dependencies]
evaluation = ["harbor==0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments"]
